name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        shell: bash
        working-directory: experiment
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
      OPENCOLLAB_SOURCE_ROOT: ${{ github.workspace }}/opencollab-source
      OPENCOLLAB_EVAL_SOURCE_ROOT: ${{ github.workspace }}/eval
      OPENCOLLAB_EXP_SOURCE_ROOT: ${{ github.workspace }}/experiment
    steps:
      - name: Check out OpenCollabExp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: experiment

      - name: Check out the companion evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RISE-X-Lab/OpenCollab-Eval
          ref: ${{ vars.OPENCOLLAB_EVAL_REF || 'codex/extract-experiment-layer' }}
          token: ${{ secrets.OPENCOLLAB_READ_TOKEN || github.token }}
          persist-credentials: false
          path: eval

      - name: Check out the compatible OpenCollab public API
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RISE-X-Lab/OpenCollab
          ref: efc5a3b0f05db9498c84de5ef0c9453aeac1f1e8
          token: ${{ secrets.OPENCOLLAB_READ_TOKEN || github.token }}
          persist-credentials: false
          path: opencollab-source

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build all three distributions
        id: wheels
        run: |
          python -m pip install build
          mkdir -p "$RUNNER_TEMP/wheels/opencollab" "$RUNNER_TEMP/wheels/eval" "$RUNNER_TEMP/wheels/experiment"
          python -m build --wheel --outdir "$RUNNER_TEMP/wheels/opencollab" ../opencollab-source
          python -m build --wheel --outdir "$RUNNER_TEMP/wheels/eval" ../eval
          python -m build --wheel --outdir "$RUNNER_TEMP/wheels/experiment" .
          oc_wheels=("$RUNNER_TEMP"/wheels/opencollab/*.whl)
          eval_wheels=("$RUNNER_TEMP"/wheels/eval/*.whl)
          exp_wheels=("$RUNNER_TEMP"/wheels/experiment/*.whl)
          test "${#oc_wheels[@]}" -eq 1
          test "${#eval_wheels[@]}" -eq 1
          test "${#exp_wheels[@]}" -eq 1
          echo "opencollab=${oc_wheels[0]}" >> "$GITHUB_OUTPUT"
          echo "eval=${eval_wheels[0]}" >> "$GITHUB_OUTPUT"
          echo "experiment=${exp_wheels[0]}" >> "$GITHUB_OUTPUT"

      - name: Install test dependencies
        run: python -m pip install "${{ steps.wheels.outputs.opencollab }}" "${{ steps.wheels.outputs.eval }}[swebench]" -e ".[dev]"

      - name: Run Ruff
        run: ruff check .

      - name: Run experiment tests
        run: pytest -q

      - name: Verify installed wheels
        if: matrix.python-version == '3.12'
        run: scripts/verify_wheel_contract.sh "${{ steps.wheels.outputs.opencollab }}" "${{ steps.wheels.outputs.eval }}" "${{ steps.wheels.outputs.experiment }}"

  deterministic-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: experiment
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
      OPENCOLLAB_SOURCE_ROOT: ${{ github.workspace }}/opencollab-source
      OPENCOLLAB_EVAL_SOURCE_ROOT: ${{ github.workspace }}/eval
      OPENCOLLAB_EXP_SOURCE_ROOT: ${{ github.workspace }}/experiment
    steps:
      - name: Check out OpenCollabExp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: experiment

      - name: Check out the companion evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RISE-X-Lab/OpenCollab-Eval
          ref: ${{ vars.OPENCOLLAB_EVAL_REF || 'codex/extract-experiment-layer' }}
          token: ${{ secrets.OPENCOLLAB_READ_TOKEN || github.token }}
          persist-credentials: false
          path: eval

      - name: Check out the compatible OpenCollab public API
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RISE-X-Lab/OpenCollab
          ref: efc5a3b0f05db9498c84de5ef0c9453aeac1f1e8
          token: ${{ secrets.OPENCOLLAB_READ_TOKEN || github.token }}
          persist-credentials: false
          path: opencollab-source

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build all three distributions
        id: wheels
        run: |
          python -m pip install build
          mkdir -p "$RUNNER_TEMP/wheels/opencollab" "$RUNNER_TEMP/wheels/eval" "$RUNNER_TEMP/wheels/experiment"
          python -m build --wheel --outdir "$RUNNER_TEMP/wheels/opencollab" ../opencollab-source
          python -m build --wheel --outdir "$RUNNER_TEMP/wheels/eval" ../eval
          python -m build --wheel --outdir "$RUNNER_TEMP/wheels/experiment" .
          oc_wheels=("$RUNNER_TEMP"/wheels/opencollab/*.whl)
          eval_wheels=("$RUNNER_TEMP"/wheels/eval/*.whl)
          exp_wheels=("$RUNNER_TEMP"/wheels/experiment/*.whl)
          test "${#oc_wheels[@]}" -eq 1
          test "${#eval_wheels[@]}" -eq 1
          test "${#exp_wheels[@]}" -eq 1
          echo "opencollab=${oc_wheels[0]}" >> "$GITHUB_OUTPUT"
          echo "eval=${eval_wheels[0]}" >> "$GITHUB_OUTPUT"
          echo "experiment=${exp_wheels[0]}" >> "$GITHUB_OUTPUT"

      - name: Install SSH and rsync
        run: |
          sudo apt-get update
          sudo apt-get install --yes openssh-server rsync
          sudo mkdir -p /run/sshd

      - name: Run deterministic SSH and candidate evaluation scenario
        env:
          OPENCOLLAB_E2E_OPENCOLLAB_WHEEL: ${{ steps.wheels.outputs.opencollab }}
          OPENCOLLAB_E2E_EVAL_WHEEL: ${{ steps.wheels.outputs.eval }}
          OPENCOLLAB_E2E_EXP_WHEEL: ${{ steps.wheels.outputs.experiment }}
        run: scripts/run_deterministic_swe_e2e.sh --output "$RUNNER_TEMP/deterministic-e2e" --runs 1

      - name: Upload deterministic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deterministic-swe-e2e
          path: ${{ runner.temp }}/deterministic-e2e
          if-no-files-found: error
          retention-days: 14
