[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "opencollab-exp"
version = "0.1.0"
description = "Experiment methods and deployment over OpenCollab-Eval and Pier."
readme = "README.md"
requires-python = ">=3.10"
license = "MulanPSL-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["opencollab-eval>=0.8.0,<0.9", "opencollab>=0.8.0,<0.9", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/KaiEureka/OpenCollabExp"
Repository = "https://github.com/KaiEureka/OpenCollabExp"

[project.scripts]
oc-exp = "opencollab_exp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opencollab_exp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
